version: '3.8'

services:
  # Backend Service (Go API)
  backend:
    build:
      context: ./Proyecto-BD2
      dockerfile: Dockerfile
    container_name: backend_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb+srv://Poposit:8RRcKEhjp927rU2Q@lab01.nznnjvt.mongodb.net/
      - DB_NAME=Proyecto1-BD2
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Frontend Service (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8080
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge
